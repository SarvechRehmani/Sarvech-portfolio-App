# The original static portfolio remains at the repository root.
# Only portfolio-v2's build output is published to the existing Netlify site.
[build]
base = "portfolio-v2"
command = "npm ci --include=dev && npm run build"
publish = "dist/portfolio/browser"
edge_functions = "netlify/edge-functions"

[build.environment]
NODE_VERSION = "22"

[[edge_functions]]
function = "seo"
path = "/*"

[[headers]]
for = "/admin*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/config.json"
[headers.values]
Cache-Control = "no-store"
