@if(cms.sharedDenied()) {
<main class="section-wrap section-space"><h1>Private preview unavailable.</h1><p>This link has expired or was revoked by the owner.</p><a href="/" data-published-link>View the published website ↗</a></main>
} @else {
<a class="skip-link" href="#main">Skip to content</a>
<div class="reading-progress" aria-hidden="true"></div>
<header class="header" portfolioHomeHeader></header>
<main id="main">
  <section id="home" class="hero section-wrap" portfolioHero></section>
  <div class="tech-ribbon">
    <div>
      <span>JAVA</span><b>✦</b><span>SPRING BOOT</span><b>✦</b
      ><span>ANGULAR</span><b>✦</b><span>MYSQL</span><b>✦</b
      ><span>REST APIs</span><b>✦</b><span>THOUGHTFUL DEVELOPMENT</span><b>✦</b>
    </div>
  </div>
  <section
    id="about"
    class="section-wrap section-space"
    portfolioAbout
  ></section>
  <section
    id="experience"
    class="section-wrap section-space"
    portfolioExperience
  ></section>
  <section
    id="skills"
    class="section-wrap section-space"
    portfolioSkills
  ></section>
  <section
    id="projects"
    class="section-wrap section-space"
    portfolioProjects
  ></section>
  <section
    id="certificates"
    class="section-wrap section-space"
    portfolioCertificates
  ></section>
  <section
    id="contact"
    class="section-wrap section-space"
    portfolioContact
  ></section>
<portfolio-additional id="additional" part="soft"></portfolio-additional><portfolio-additional id="testimonials" part="testimonials"></portfolio-additional><portfolio-additional id="blog" part="blog"></portfolio-additional></main>
<footer class="section-wrap" portfolioHomeFooter></footer>
<dialog id="image-dialog" portfolioHomeDialog></dialog>
}
