[build]
command = "npm ci --include=dev && npm run build"
publish = "dist/portfolio/browser"

[build.environment]
NODE_VERSION = "22"

[[edge_functions]]
function = "seo"
path = "/*"

[[headers]]
for = "/admin*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/config.json"
[headers.values]
Cache-Control = "no-store"

